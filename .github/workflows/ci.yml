name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip check
      - name: Compile maintained modules
        run: python -m compileall -q bone_marrow_differential.py cli.py marrow_mind.py
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke test installed CLI
        run: |
          bone-marrow-differential --demo normal > /tmp/demo.txt
          grep -F "INTERPRETIVE CATEGORY" /tmp/demo.txt
          bone-marrow-differential batch -i sample.csv -o /tmp/out.csv
          test -s /tmp/out.csv

  browser-smoke:
    name: Browser / Pyodide smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/bm-http.log 2>&1 &
          echo $! > /tmp/bm-http.pid
      - name: Execute browser Python runtime
        run: |
          google-chrome --headless --no-sandbox --disable-gpu \
            --virtual-time-budget=30000 \
            --dump-dom "http://127.0.0.1:8000/?smoke=1" > /tmp/dom.html
          grep -F 'data-smoke="pass"' /tmp/dom.html
          grep -F 'Python ready' /tmp/dom.html
          grep -F 'No major numerical abnormality detected' /tmp/dom.html
      - name: Stop static server
        if: always()
        run: kill "$(cat /tmp/bm-http.pid)" 2>/dev/null || true
