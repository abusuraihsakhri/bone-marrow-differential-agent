[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bone-marrow-differential-agent"
version = "2.1.0"
description = "Bone marrow differential calculator and conservative hematopathology interpretation aid"
readme = "README.md"
authors = [{ name = "NAME" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
bone-marrow-differential = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/bone-marrow-differential-agent"
Repository = "https://github.com/abusuraihsakhri/bone-marrow-differential-agent.git"

[tool.setuptools]
py-modules = ["bone_marrow_differential", "cli", "marrow_mind"]
